version: "3.8"
services:
    # Scorpio is the context broker
    scorpio:
        labels:
            org.fiware: tutorial
        image: quay.io/fiware/scorpio:java-${SCORPIO_VERSION}
        hostname: scorpio
        container_name: fiware-scorpio
        networks:
            - default
        ports:
            - "${SCORPIO_PORT}:${SCORPIO_PORT}"
        restart: on-failure
        depends_on:
            postgres:
              condition: service_healthy

    postgres:
        labels:
            org.fiware: tutorial
        image: postgis/postgis:${POSTGIS_VERSION}
        hostname: postgres
        container_name: db-postgres
        networks:
            - default
        ports:
            - "5432"
        environment:
            POSTGRES_USER: ngb
            POSTGRES_PASSWORD: ngb
            POSTGRES_DB: ngb
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ngb -d ngb"]
            interval: 5s
            timeout: 5s
            retries: 20
        logging:
            driver: none
        volumes:
            - postgres-db:/var/lib/postgresql/data

    farmer:
        environment:
            - CONTEXT_BROKER=http://apisix:${APISIX_PORT}/scorpio

    devices:
        environment:
            - CONTEXT_BROKER=http://apisix:${APISIX_PORT}/scorpio

    tutorial:
        environment:
            - CONTEXT_BROKER=http://apisix:${APISIX_PORT}/scorpio/ngsi-ld/v1

    iot-agent:
        environment:
            - IOTA_CB_PATH=/data/scorpio

volumes:
    postgres-db: ~
