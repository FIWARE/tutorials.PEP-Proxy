events {
    worker_connections 1024;
}

http {
    server {
        listen 1030;

        # Health endpoint — bypasses auth (used by Docker healthcheck)
        location = /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # All NGSI-LD requests validated against the Python RBAC service
        location / {
            auth_request     /validate;

            proxy_pass       http://orion:1026;
            proxy_set_header Host          $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Internal auth subrequest — never called directly by clients
        location = /validate {
            internal;
            proxy_pass              http://auth-service:5000/auth;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length     "";
            proxy_set_header        X-Forwarded-Method $request_method;
            proxy_set_header        Authorization      $http_authorization;
        }
    }
}
